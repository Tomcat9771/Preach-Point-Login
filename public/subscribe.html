<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Preach Point — Subscribe</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header class="app-title">
      <img id="logo" src="/logo.png" alt="Preach Point Logo" />
    </header>

    <h1>Subscription required</h1>
    <p>You need an active subscription to access Preach Point.</p>
    <div class="actions">
      <button id="subscribeBtn">Subscribe — R99 / month</button>
      <button id="loginBtn">Return to login</button>
    </div>
  </div>
  <script src="popup.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
    import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB6mjVxBIW8d2dMD6jRe9MD257qsNC2Ia0",
      authDomain: "preach-point.firebaseapp.com",
      projectId: "preach-point",
      storageBucket: "preach-point.firebasestorage.app",
      messagingSenderId: "699269130347",
      appId: "1:699269130347:web:a6617996b042821089692e",
      measurementId: "G-3L6CZ43J51"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    await setPersistence(auth, browserLocalPersistence);

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        location.href = '/login.html';
      }
    });

    document.getElementById('loginBtn').onclick = () => {
      location.href = '/login.html';
    };

    document.getElementById('subscribeBtn').onclick = async () => {
      try {
        const t = await auth.currentUser.getIdToken(true);
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/api/payfast/subscribe';
        form.target = '_blank';

        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'token';
        input.value = t;
        form.appendChild(input);

        document.body.appendChild(form);
        form.submit();
        form.remove();
      } catch (e) {
        ppAlert(e.message || e);
      }
    };
  </script>
</body>
</html>
