<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Payment received</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../style.css" />
</head>
<body>
  <div class="container">
    <header class="app-title">
      <img id="logo" src="/logo.png" alt="Preach Point Logo" />
    </header>

    <h1>Thank you!</h1>
    <p>Your payment was received.</p>
    <p id="status">Verifying payment…</p>
    <button onclick="location.href='/'">Back to Preach Point</button>
  </div>
  <script>
    async function checkSubscription() {
      try {
        const res = await fetch('/api/me');
        if (res.ok) {
          const data = await res.json();
          if (data.subscriber) {
            window.location.href = '/index.html';
            return;
          }
        }
      } catch (e) {
        // Ignore network errors and keep polling
      }
      setTimeout(checkSubscription, 2000);
    }

    document.addEventListener('DOMContentLoaded', () => {
      checkSubscription();
    });
  </script>
</body>
</html>
